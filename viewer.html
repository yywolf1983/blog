<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Viewer - YY's Blog</title>
  <link rel="stylesheet" href="assets/vendor/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/md.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-file-alt"></i> File Viewer</h1>
    </div>
    
    <div class="breadcrumb" id="breadcrumb">
      <a href="index.html">首页</a>
    </div>
    
    <div class="content">
      <div id="contentArea">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i> 加载中...
        </div>
      </div>
    </div>
  </div>
  
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global',
        mtextInheritFont: true,
        scale: 1.5
      },
      mathml: {
        extensions: ['+core', '+base']
      }
    };
  </script>
  <link rel="stylesheet" href="assets/css/viewer-md.css">
  <script src="assets/vendor/marked/9.1.2/marked.min.js"></script>
  <script src="assets/vendor/mathjax/3/es5/tex-svg-full.js" id="MathJax-script"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const file = urlParams.get('file');
    
    if (!file) {
      document.getElementById('contentArea').innerHTML = `
        <div class="error">
          <i class="fas fa-exclamation-circle"></i>
          <p>未指定文件参数</p>
          <p>请使用 ?file=路径/文件名 的格式访问</p>
        </div>
      `;
    } else {
      // 检测文件类型
      const fileExtension = file.split('.').pop().toLowerCase();
      const contentArea = document.getElementById('contentArea');
      
      // 更新面包屑
      const pathParts = file.split('/');
      let breadcrumbHTML = '<a href="index.html">首页</a>';
      pathParts.forEach((part, index) => {
        if (index < pathParts.length - 1) {
          breadcrumbHTML += `<span>/</span><a href="viewer.html?file=${pathParts.slice(0, index + 1).join('/')}/index.md">${part}</a>`;
        } else {
          breadcrumbHTML += `<span>/</span><span>${part}</span>`;
        }
      });
      document.getElementById('breadcrumb').innerHTML = breadcrumbHTML;
      document.title = pathParts[pathParts.length - 1] + ' - YY\'s Blog';
      
      // 处理不同类型的文件
      if (['md', 'markdown'].includes(fileExtension)) {
        // 处理Markdown文件
        fetch(file)
          .then(response => {
            if (!response.ok) {
              throw new Error('文件不存在');
            }
            return response.text();
          })
          .then(markdown => {
            // 自定义 slugify：保留中英文与数字，去除其余符号并转小写
            function slugify(text) {
              return String(text)
                .trim()
                .replace(/[`*_~]/g, '')
                .replace(/[^\w一-龥]/g, '')
                .toLowerCase();
            }
            // 给标题生成稳定 id（中文标题也能正确锚定）
            const renderer = new marked.Renderer();
            renderer.heading = function(text, level, raw) {
              const id = slugify(raw || text);
              return `<h${level} id="${id}">${text}</h${level}>\n`;
            };
            marked.setOptions({ renderer: renderer, headerIds: false, mangle: false });

            const html = marked.parse(markdown);
            // 检测是否是index.md文件
            const isReadme = file.includes('index.md');
            const className = isReadme ? 'markdown-body readme-file' : 'markdown-body regular-md-file';
            contentArea.innerHTML = `<div class="${className}">${html}</div>`;

            // 统一页内锚点链接 href，使其与标题 id 完全匹配
            // 注意：DOM 中 href 的中文会被 percent-encode，需先 decode 再 slugify
            contentArea.querySelectorAll('a[href^="#"]').forEach(a => {
              let hash = a.getAttribute('href').slice(1);
              try { hash = decodeURIComponent(hash); } catch (e) {}
              if (hash) a.setAttribute('href', '#' + slugify(hash));
            });

            // 平滑滚动 + 避免被固定头部遮挡
            contentArea.querySelectorAll('a[href^="#"]').forEach(a => {
              a.addEventListener('click', function(e) {
                let id = this.getAttribute('href').slice(1);
                try { id = decodeURIComponent(id); } catch (err) {}
                const target = document.getElementById(id);
                if (target) {
                  e.preventDefault();
                  target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                  history.replaceState(null, '', '#' + encodeURIComponent(id));
                }
              });
            });

            // 触发MathJax渲染
            if (window.MathJax) {
              if (MathJax.typeset) {
                MathJax.typeset();
              } else if (MathJax.typesetPromise) {
                MathJax.typesetPromise();
              }
            }
          })
          .catch(error => {
            contentArea.innerHTML = `
              <div class="error">
                <i class="fas fa-exclamation-triangle"></i>
                <p>加载失败: ${error.message}</p>
                <p>文件: ${file}</p>
              </div>
            `;
          });
      } else if (['jpg', 'jpeg', 'png', 'gif', 'svg', 'bmp', 'webp'].includes(fileExtension)) {
        // 处理图片文件
        contentArea.innerHTML = `
          <div class="image-viewer">
            <img src="${file}" alt="${pathParts[pathParts.length - 1]}">
            <p style="margin-top: 20px; color: #a0a0a0;">${pathParts[pathParts.length - 1]}</p>
          </div>
        `;
      } else if (['html', 'htm'].includes(fileExtension)) {
        // 处理HTML文件，使用iframe加载
        contentArea.innerHTML = `
          <div class="html-viewer">
            <iframe id="htmlIframe" src="${file}" scrolling="no" style="width: 100%; border: none; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); overflow: hidden;"></iframe>
            <p style="margin-top: 15px; color: #a0a0a0;">${pathParts[pathParts.length - 1]}</p>
          </div>
        `;
        // 动态调整iframe高度以适应内容
        const iframe = document.getElementById('htmlIframe');
        iframe.onload = function() {
          try {
            const contentHeight = iframe.contentWindow.document.body.scrollHeight;
            iframe.style.height = contentHeight + 'px';
          } catch (e) {
            // 跨域安全限制，使用默认高度
            iframe.style.height = '80vh';
          }
        };
      } else if (['txt', 'text', 'log', 'md', 'markdown', 'css', 'js', 'json', 'xml', 'yml', 'yaml', 'ini', 'conf', 'sh', 'py', 'java', 'c', 'cpp', 'h', 'hpp', 'go', 'rs', 'php', 'rb', 'swift', 'kt', 'ts', 'jsx', 'tsx'].includes(fileExtension)) {
        // 处理文本文件
        fetch(file)
          .then(response => {
            if (!response.ok) {
              throw new Error('文件不存在');
            }
            return response.text();
          })
          .then(text => {
            contentArea.innerHTML = `
              <div class="text-viewer">
                <pre>${escapeHtml(text)}</pre>
              </div>
            `;
          })
          .catch(error => {
            contentArea.innerHTML = `
              <div class="error">
                <i class="fas fa-exclamation-triangle"></i>
                <p>加载失败: ${error.message}</p>
                <p>文件: ${file}</p>
              </div>
            `;
          });
      } else {
        // 处理二进制文件
        contentArea.innerHTML = `
          <div class="binary-file">
            <div class="icon"><i class="fas fa-file-binary"></i></div>
            <h3>${pathParts[pathParts.length - 1]}</h3>
            <p style="margin: 20px 0; color: #a0a0a0;">这是一个二进制文件</p>
            <a href="${file}" class="btn">下载</a>
          </div>
        `;
      }
    }
    
    // 转义HTML特殊字符
    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
