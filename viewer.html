<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Viewer - YY's Blog</title>
  <link rel="stylesheet" href="assets/vendor/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/md.css">
  <link rel="stylesheet" href="assets/css/viewer-md.css">
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      svg: {
        fontCache: 'global',
        mtextInheritFont: true,
        scale: 1.5
      },
      mathml: {
        extensions: ['+core', '+base']
      }
    };
  </script>
  <script src="assets/vendor/marked/9.1.2/marked.min.js"></script>
  <script src="assets/vendor/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="assets/vendor/mathjax/3/es5/tex-svg-full.js" id="MathJax-script"></script>
  <style>
    /* ===== viewer 页面样式（与首页同宽 + 玻璃顶栏 + 卡片正文） ===== */
    html, body { margin: 0 !important; padding: 0 !important; }

    /* 容器与首页同宽（1180px 居中），保证详情与首页宽度一致 */
    .container {
      max-width: 1180px !important;
      margin: 0 auto !important;
      padding: var(--spacing-2xl) var(--spacing-lg) var(--spacing-xl) !important;
    }

    /* 玻璃顶栏（与首页 Hero 一致的卡片风格） */
    .container .header {
      margin: 0 0 var(--spacing-lg) !important;
      padding: var(--spacing-md) var(--spacing-lg) !important;
      background: rgba(44, 62, 80, 0.85) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid var(--color-border) !important;
      border-radius: var(--radius-xl) !important;
      box-shadow: var(--shadow-md) !important;
      display: flex !important;
      align-items: center !important;
      gap: var(--spacing-sm) !important;
    }
    .container .header h1 {
      margin: 0 !important;
      font-size: 1.2rem !important;
      font-weight: 700 !important;
      color: var(--color-text-light) !important;
      text-shadow: none !important;
    }

    /* 面包屑：轻量 */
    .container .breadcrumb {
      margin: var(--spacing-xs) 0 var(--spacing-lg) 0 !important;
      padding: 6px var(--spacing-md) !important;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      font-size: 0.9rem !important;
    }

    /* 内容容器：无卡片边框（避免与正文卡片双重边距） */
    .container .content {
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      background: transparent !important;
      max-width: none !important;
    }
    .container .content::before { display: none !important; }
    .container .content #contentArea { margin: 0 !important; padding: 0 !important; }

    /* 正文卡片：边框 + 内距（与首页卡片风格一致） */
    #contentArea .markdown-body {
      padding: var(--spacing-xl) var(--spacing-2xl) !important;
      margin: 0 !important;
      border: 1px solid var(--color-border) !important;
      box-shadow: var(--shadow-md) !important;
      border-radius: var(--radius-lg) !important;
      background: var(--color-surface) !important;
      max-width: 100% !important;
    }
    #contentArea .markdown-body > :first-child { margin-top: 0 !important; }

    /* ===== 正文排版放大与美化 ===== */
    #contentArea .markdown-body {
      font-size: 1.15rem !important;
      line-height: 1.85 !important;
      letter-spacing: 0.015em !important;
      color: var(--color-text) !important;
    }
    #contentArea .markdown-body > * { max-width: 100% !important; }

    /* 标题 */
    #contentArea .markdown-body h1,
    #contentArea .markdown-body h2,
    #contentArea .markdown-body h3,
    #contentArea .markdown-body h4,
    #contentArea .markdown-body h5,
    #contentArea .markdown-body h6 {
      color: var(--color-heading) !important;
      font-weight: 700 !important;
      line-height: 1.3 !important;
      margin-top: 1.6em !important;
      margin-bottom: 0.7em !important;
    }
    #contentArea .markdown-body h1 { font-size: 2em !important; padding-bottom: 0.3em !important; border-bottom: 2px solid var(--color-border) !important; }
    #contentArea .markdown-body h2 { font-size: 1.6em !important; padding-bottom: 0.25em !important; border-bottom: 1px solid var(--color-border) !important; }
    #contentArea .markdown-body h3 { font-size: 1.35em !important; }
    #contentArea .markdown-body h4 { font-size: 1.18em !important; }
    #contentArea .markdown-body h5 { font-size: 1.04em !important; }
    #contentArea .markdown-body h6 { font-size: 0.94em !important; color: var(--color-text-muted) !important; text-transform: uppercase !important; letter-spacing: 0.05em !important; }

    /* 段落与强调 */
    #contentArea .markdown-body p { margin: 0 0 1.1em !important; line-height: 1.85 !important; }
    #contentArea .markdown-body strong { color: var(--color-heading) !important; font-weight: 700 !important; }
    #contentArea .markdown-body em { color: var(--color-text-muted) !important; }
    #contentArea .markdown-body mark { background: rgba(230, 126, 34, 0.28) !important; color: var(--color-text-light) !important; padding: 0 0.25em !important; border-radius: var(--radius-sm) !important; }

    /* 链接（统一橙色强调） */
    #contentArea .markdown-body a {
      color: var(--color-accent) !important;
      text-decoration: none !important;
      border-bottom: 1px solid rgba(230, 126, 34, 0.4) !important;
      transition: border-color .2s, color .2s !important;
    }
    #contentArea .markdown-body a:hover { color: var(--color-accent-secondary) !important; border-bottom-color: var(--color-accent-secondary) !important; }

    /* 列表 */
    #contentArea .markdown-body ul,
    #contentArea .markdown-body ol { margin: 0 0 1.1em !important; padding-left: 1.6em !important; }
    #contentArea .markdown-body li { margin: 0.35em 0 !important; line-height: 1.85 !important; }
    #contentArea .markdown-body li::marker { color: var(--color-accent) !important; }
    #contentArea .markdown-body li.task-list-item { list-style: none !important; }
    #contentArea .markdown-body input[type="checkbox"] { margin-right: 0.5em !important; transform: translateY(1px); }

    /* 引用块 */
    #contentArea .markdown-body blockquote {
      margin: 0 0 1.2em !important;
      padding: 0.9em 1.3em !important;
      border-left: 4px solid var(--color-accent) !important;
      background: var(--color-surface-alt, rgba(255, 255, 255, 0.05)) !important;
      border-radius: 0 var(--radius-md) var(--radius-md) 0 !important;
      color: var(--color-text-muted) !important;
    }
    #contentArea .markdown-body blockquote p { margin: 0 !important; }

    /* 内联代码 */
    #contentArea .markdown-body code {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace !important;
      font-size: 0.9em !important;
      background: var(--color-surface-alt, rgba(255, 255, 255, 0.1)) !important;
      padding: 0.2em 0.45em !important;
      border-radius: var(--radius-sm) !important;
      color: #e6a8ff !important;
      border: 1px solid var(--color-border) !important;
    }

    /* 代码块（顶部渐变线） */
    #contentArea .markdown-body pre {
      position: relative !important;
      margin: 0 0 1.2em !important;
      padding: 1.3em 1.3em 1.1em !important;
      background: #1e2a3a !important;
      border: 1px solid var(--color-border) !important;
      border-radius: var(--radius-md) !important;
      overflow-x: auto !important;
      line-height: 1.6 !important;
    }
    #contentArea .markdown-body pre::before {
      content: '' !important;
      position: absolute !important;
      top: 0 !important; left: 0 !important; right: 0 !important;
      height: 3px !important;
      background: linear-gradient(90deg, var(--color-accent), var(--color-accent-secondary)) !important;
      border-radius: var(--radius-md) var(--radius-md) 0 0 !important;
    }
    #contentArea .markdown-body pre code { background: transparent !important; padding: 0 !important; border: none !important; color: inherit !important; font-size: 0.9em !important; }

    /* 表格 */
    #contentArea .markdown-body table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 0 0 1.2em !important;
      font-size: 0.95em !important;
      border-radius: var(--radius-md) !important;
      overflow: hidden !important;
      border: 1px solid var(--color-border) !important;
    }
    #contentArea .markdown-body th,
    #contentArea .markdown-body td { border: 1px solid var(--color-border) !important; padding: 0.65em 0.95em !important; }
    #contentArea .markdown-body th { background: var(--color-surface-alt, rgba(255, 255, 255, 0.06)) !important; font-weight: 700 !important; color: var(--color-heading) !important; }
    #contentArea .markdown-body tbody tr:nth-child(even) { background: rgba(255, 255, 255, 0.03) !important; }

    /* 定义列表 */
    #contentArea .markdown-body dl { margin: 0 0 1.2em !important; }
    #contentArea .markdown-body dt { font-weight: 700 !important; color: var(--color-heading) !important; margin-top: 0.6em !important; }
    #contentArea .markdown-body dd { margin: 0 0 0.4em !important; color: var(--color-text-muted) !important; }

    /* 键盘按键 */
    #contentArea .markdown-body kbd {
      font-family: 'SFMono-Regular', Consolas, monospace !important;
      font-size: 0.85em !important;
      background: var(--color-surface-alt, rgba(255, 255, 255, 0.1)) !important;
      border: 1px solid var(--color-border) !important;
      border-bottom-width: 2px !important;
      border-radius: var(--radius-sm) !important;
      padding: 0.1em 0.5em !important;
      color: var(--color-text) !important;
    }

    /* 图片 */
    #contentArea .markdown-body img {
      max-width: 100% !important;
      border-radius: var(--radius-md) !important;
      box-shadow: var(--shadow-sm) !important;
      margin: 0.6em 0 !important;
      display: block !important;
    }

    /* 分隔线 */
    #contentArea .markdown-body hr { border: none !important; border-top: 1px solid var(--color-border) !important; margin: 1.8em 0 !important; }

    /* 脚注/上标链接 */
    #contentArea .markdown-body sup a { color: var(--color-accent) !important; }

    /* 移动端 */
    @media (max-width: 768px) {
      .container { padding: var(--spacing-lg) var(--spacing-md) !important; }
      #contentArea .markdown-body { padding: var(--spacing-lg) var(--spacing-md) !important; }
    }
    /* ===== 返回顶部浮动按钮 ===== */
    #backToTop {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-secondary));
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      visibility: hidden;
      transform: translateY(16px) scale(0.9);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s, box-shadow 0.3s ease;
      z-index: 1000;
    }
    #backToTop.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
    #backToTop:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: var(--shadow-xl);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-file-alt"></i> File Viewer</h1>
    </div>

    <div class="breadcrumb" id="breadcrumb">
      <a href="index.html">首页</a>
    </div>

    <div class="content">
      <div id="contentArea">
        <div class="loading">
          <i class="fas fa-spinner fa-spin"></i> 加载中...
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // 站点文件树配置（位于根目录，仅作为数据源，不对外展示）
      const CONFIG_FILE = 'filetree.yaml';
      const params = new URLSearchParams(window.location.search);
      const rawFile = params.get('file');
      const contentArea = document.getElementById('contentArea');
      const breadcrumbEl = document.getElementById('breadcrumb');

      let FILETREE = null;

      // 路径工具：按段编码，保留 /
      function encPath(p) {
        return String(p).split('/').map(encodeURIComponent).join('/');
      }
      function normPath(p) {
        return String(p == null ? '' : p).replace(/^\/+|\/+$/g, '');
      }
      function joinPath(base, name) {
        return base ? base + '/' + name : name;
      }

      // 加载并解析文件树配置
      async function loadFileTree() {
        if (FILETREE) return FILETREE;
        const res = await fetch(CONFIG_FILE, { cache: 'no-cache' });
        if (!res.ok) throw new Error('无法加载文件树配置');
        const text = await res.text();
        FILETREE = window.jsyaml ? jsyaml.load(text) : JSON.parse(text);
        return FILETREE;
      }

      // 判断当前请求是否为"目录浏览"，是则返回目录路径，否则返回 null
      function resolveDirRequest(tree) {
        const dirs = (tree && tree.dirs) || {};
        // 未指定 file：浏览站点根目录
        if (rawFile === null) return '';
        const p = rawFile;
        // 兼容旧链接：xxx/index.md 视为目录 xxx
        if (p === 'index.md' || p.endsWith('/index.md')) {
          return normPath(p.slice(0, p.length - 'index.md'.length));
        }
        // 以 / 结尾表示目录
        if (p.endsWith('/')) return normPath(p);
        const np = normPath(p);
        // 无扩展名且配置中存在该目录
        if (Object.prototype.hasOwnProperty.call(dirs, np)) return np;
        return null;
      }

      // 设置面包屑（目录分级链接走目录浏览）
      function setBreadcrumb(dirPath) {
        let html = '<a href="index.html">首页</a>';
        if (dirPath) {
          const parts = dirPath.split('/');
          let acc = '';
          parts.forEach(function (part) {
            acc = acc ? acc + '/' + part : part;
            html += '<span>/</span><a href="viewer.html?file=' + encPath(acc) + '/">' + part + '</a>';
          });
        }
        breadcrumbEl.innerHTML = html;
      }

      // 文件浏览时的面包屑（末级为文件名）
      function setFileBreadcrumb(filePath) {
        const parts = filePath.split('/');
        let html = '<a href="index.html">首页</a>';
        let acc = '';
        parts.forEach(function (part, index) {
          if (index < parts.length - 1) {
            acc = acc ? acc + '/' + part : part;
            html += '<span>/</span><a href="viewer.html?file=' + encPath(acc) + '/">' + part + '</a>';
          } else {
            html += '<span>/</span><span>' + part + '</span>';
          }
        });
        breadcrumbEl.innerHTML = html;
      }

      // 自定义 slugify：保留中英文与数字，去除其余符号并转小写
      function slugify(text) {
        return String(text)
          .trim()
          .replace(/[`*_~]/g, '')
          .replace(/[^\w一-龥]/g, '')
          .toLowerCase();
      }

      // 渲染 Markdown（目录列表与普通文档共用）
      function renderMarkdown(markdown, isDir) {
        const renderer = new marked.Renderer();
        renderer.heading = function (text, level, raw) {
          const id = slugify(raw || text);
          return '<h' + level + ' id="' + id + '">' + text + '</h' + level + '>\n';
        };
        marked.setOptions({ renderer: renderer, headerIds: false, mangle: false });

        const html = marked.parse(markdown);
        const className = isDir ? 'markdown-body readme-file' : 'markdown-body regular-md-file';
        contentArea.innerHTML = '<div class="' + className + '">' + html + '</div>';

        // 统一页内锚点链接 href，使其与标题 id 完全匹配（中文会被 percent-encode，需先 decode）
        contentArea.querySelectorAll('a[href^="#"]').forEach(function (a) {
          let hash = a.getAttribute('href').slice(1);
          try { hash = decodeURIComponent(hash); } catch (e) {}
          if (hash) a.setAttribute('href', '#' + slugify(hash));
        });

        contentArea.querySelectorAll('a[href^="#"]').forEach(function (a) {
          a.addEventListener('click', function (e) {
            let id = this.getAttribute('href').slice(1);
            try { id = decodeURIComponent(id); } catch (err) {}
            const target = document.getElementById(id);
            if (target) {
              e.preventDefault();
              target.scrollIntoView({ behavior: 'smooth', block: 'start' });
              history.replaceState(null, '', '#' + encodeURIComponent(id));
            }
          });
        });

        if (window.MathJax) {
          if (MathJax.typeset) {
            MathJax.typeset();
          } else if (MathJax.typesetPromise) {
            MathJax.typesetPromise();
          }
        }
      }

      // 渲染目录列表（数据来自根配置文件，而非目录下的 index.md）
      function renderDirectory(dirPath, tree) {
        const node = tree.dirs[dirPath];
        if (!node) return false;

        const title = dirPath ? dirPath.split('/').pop() : (tree.root_title || '站点');
        let md = '# ' + title + ' 目录\n\n';

        if (!node.dirs.length && !node.files.length) {
          md += '- （空目录）\n';
        }

        node.dirs.forEach(function (name) {
          const p = joinPath(dirPath, name);
          md += '- **[' + name + '/](viewer.html?file=' + encPath(p) + '/)**\n';
        });
        node.files.forEach(function (name) {
          const p = joinPath(dirPath, name);
          md += '- **[' + name + '](viewer.html?file=' + encPath(p) + ')**\n';
        });

        setBreadcrumb(dirPath);
        document.title = title + ' - 目录浏览';
        renderMarkdown(md, true);
        return true;
      }

      function showError(title, detail) {
        contentArea.innerHTML =
          '<div class="error">' +
          '<i class="fas fa-exclamation-triangle"></i>' +
          '<p>' + title + '</p>' +
          (detail ? '<p>' + detail + '</p>' : '') +
          '<p><a href="index.html">返回首页</a></p>' +
          '</div>';
      }

      // 配置文件不对外展示
      function showConfigNotice() {
        setBreadcrumb('');
        document.title = '站点配置 - YY\'s Blog';
        contentArea.innerHTML =
          '<div class="error">' +
          '<i class="fas fa-cog"></i>' +
          '<p>该文件是站点配置文件，不提供预览</p>' +
          '<p><a href="index.html">返回首页</a> · <a href="viewer.html">浏览全部文件</a></p>' +
          '</div>';
      }

      // 按类型渲染具体文件
      function renderFile(file) {
        if (!file) {
          showError('未指定文件参数', '请使用 ?file=路径/文件名 的格式访问，或直接浏览根目录');
          return;
        }

        const fileExtension = file.split('.').pop().toLowerCase();
        setFileBreadcrumb(file);
        document.title = file.split('/').pop() + ' - YY\'s Blog';

        if (['md', 'markdown'].includes(fileExtension)) {
          fetch(file)
            .then(function (response) {
              if (!response.ok) throw new Error('文件不存在');
              return response.text();
            })
            .then(function (markdown) {
              renderMarkdown(markdown, false);
            })
            .catch(function (error) {
              showError('加载失败: ' + error.message, '文件: ' + file);
            });
        } else if (['jpg', 'jpeg', 'png', 'gif', 'svg', 'bmp', 'webp'].includes(fileExtension)) {
          contentArea.innerHTML =
            '<div class="image-viewer">' +
            '<img src="' + encPath(file) + '" alt="' + file.split('/').pop() + '">' +
            '<p style="margin-top: 20px; color: #a0a0a0;">' + file.split('/').pop() + '</p>' +
            '</div>';
        } else if (['html', 'htm'].includes(fileExtension)) {
          contentArea.innerHTML =
            '<div class="html-viewer">' +
            '<iframe id="htmlIframe" src="' + encPath(file) + '" scrolling="no" style="width: 100%; border: none; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3); overflow: hidden;"></iframe>' +
            '<p style="margin-top: 15px; color: #a0a0a0;">' + file.split('/').pop() + '</p>' +
            '</div>';
          const iframe = document.getElementById('htmlIframe');
          iframe.onload = function () {
            try {
              iframe.style.height = iframe.contentWindow.document.body.scrollHeight + 'px';
            } catch (e) {
              iframe.style.height = '80vh';
            }
          };
        } else if (['txt', 'text', 'log', 'css', 'js', 'json', 'xml', 'yml', 'yaml', 'ini', 'conf', 'sh', 'py', 'java', 'c', 'cpp', 'h', 'hpp', 'go', 'rs', 'php', 'rb', 'swift', 'kt', 'ts', 'jsx', 'tsx'].includes(fileExtension)) {
          fetch(file)
            .then(function (response) {
              if (!response.ok) throw new Error('文件不存在');
              return response.text();
            })
            .then(function (text) {
              contentArea.innerHTML =
                '<div class="text-viewer"><pre>' + escapeHtml(text) + '</pre></div>';
            })
            .catch(function (error) {
              showError('加载失败: ' + error.message, '文件: ' + file);
            });
        } else {
          contentArea.innerHTML =
            '<div class="binary-file">' +
            '<div class="icon"><i class="fas fa-file-binary"></i></div>' +
            '<h3>' + file.split('/').pop() + '</h3>' +
            '<p style="margin: 20px 0; color: #a0a0a0;">这是一个二进制文件</p>' +
            '<a href="' + encPath(file) + '" class="btn">下载</a>' +
            '</div>';
        }
      }

      function escapeHtml(text) {
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // 主流程
      (async function init() {
        // 配置文件本身不展示
        if (normPath(rawFile) === CONFIG_FILE) {
          showConfigNotice();
          return;
        }

        let tree = null;
        try {
          tree = await loadFileTree();
        } catch (e) {
          tree = null;
        }

        if (tree && tree.dirs) {
          const dir = resolveDirRequest(tree);
          if (dir !== null && renderDirectory(dir, tree)) return;
        }

        // 配置不可用或未命中目录时，按原逻辑渲染文件
        if (rawFile === null) {
          showError('无法加载站点配置', '请先运行 python3 generate_readme.py 生成 ' + CONFIG_FILE);
          return;
        }
        renderFile(rawFile);
      })();
    })();

    // 返回顶部浮动按钮：滚动超过阈值时显示，点击平滑回到顶部
    // 注意：按钮元素在脚本之后，需等 DOM 解析完成再绑定
    (function () {
      const init = function () {
        const btn = document.getElementById('backToTop');
        if (!btn) return;
        const onScroll = function () {
          if (window.scrollY > 400) btn.classList.add('show');
          else btn.classList.remove('show');
        };
        window.addEventListener('scroll', onScroll, { passive: true });
        onScroll();
        btn.addEventListener('click', function () {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      };
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
  <button id="backToTop" aria-label="返回顶部" title="返回顶部">
    <i class="fas fa-arrow-up"></i>
  </button>
</body>
</html>
