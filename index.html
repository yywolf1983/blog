<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>加载中...</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="加载中...">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="assets/vendor/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body>
  <div class="container">
    <div class="header" id="header">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i> 加载中...
      </div>
    </div>

    <div id="contentSections">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i> 加载内容中...
      </div>
    </div>

    <div class="footer" id="footer">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i> 加载中...
      </div>
    </div>
  </div>
  <!-- YAML解析库 -->
  <script src="assets/vendor/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script>
    const CONFIG_URL = 'website.yaml';
    const CACHE_KEY = 'website.yaml.cache.v1';

    // 生成 viewer 链接：站内相对路径走 viewer.html，绝对 URL（http/https、//、mailto 等）原样返回
    function viewerUrl(link) {
      if (!link) return 'viewer.html';
      if (/^(https?:)?\/\//i.test(link) || /^(mailto:|tel:|#)/i.test(link)) return link;
      return 'viewer.html?file=' + String(link).split('/').map(encodeURIComponent).join('/');
    }

    // 轻量同步哈希，用于判断配置内容是否变化（FNV-1a）
    function hashString(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return (h >>> 0).toString(16);
    }

    // 加载并解析YAML文件：
    //  - 浏览器 HTTP 缓存 + 服务器 304 校验减少重复传输
    //  - sessionStorage 缓存解析结果，内容哈希一致时跳过解析
    //  - 配置内容变化（哈希不同）自动重新解析，普通刷新即可生效
    async function loadWebsiteConfig() {
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const response = await fetch(CONFIG_URL); // 默认缓存，依赖服务器 304
          if (!response.ok) throw new Error('无法加载配置文件');
          const yamlText = await response.text();
          const hash = hashString(yamlText);
          let cached = null;
          try { cached = JSON.parse(sessionStorage.getItem(CACHE_KEY) || 'null'); } catch (e) {}
          if (cached && cached.hash === hash) {
            return cached.data; // 内容未变，直接复用缓存，跳过解析
          }
          const data = jsyaml.load(yamlText);
          try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ hash, data })); } catch (e) {}
          return data;
        } catch (error) {
          if (attempt === 1) {
            console.error('加载配置文件失败:', error);
            return null;
          }
          await new Promise(resolve => setTimeout(resolve, 400));
        }
      }
      return null;
    }

    // 生成页面内容
    function generatePageContent(config) {
      // 更新网站标题与描述
      document.title = config.name || '网站标题';
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', config.description || '');

      // 更新头部
      const header = document.getElementById('header');
      let headerHTML = `
        <div class="header-top">
          <div class="logo-container">
      `;

      // 添加logo
      if (config.logo) {
        headerHTML += `<img src="${config.logo}" alt="${config.name || '网站logo'}" class="logo" loading="lazy">`;
      } else {
        headerHTML += `<div class="logo"><i class="fas fa-blog" style="font-size: 48px; color: var(--color-accent); padding: 16px;"></i></div>`;
      }

      headerHTML += `
            <div class="header-info">
              <h1><i class="fas fa-blog" style="margin-right: 10px; color: var(--color-accent); text-shadow: 0 0 15px var(--color-accent);"></i> ${config.name || '网站标题'}</h1>
              <p>${config.description || '网站描述'}</p>
            </div>
          </div>
        </div>
      `;

      // 添加分类导航
      if (config.categories && config.categories.length > 0) {
        headerHTML += `
          <div class="category-nav">
        `;
        config.categories.forEach(category => {
          headerHTML += `
            <a href="${viewerUrl(category.link)}" class="category-item">
              <i class="fas fa-${category.icon || 'folder'}"></i>
              ${category.title}
            </a>
          `;
        });
        headerHTML += `
          </div>
        `;
      }

      header.innerHTML = headerHTML;

      // 更新内容部分
      const contentSections = document.getElementById('contentSections');
      contentSections.innerHTML = '';

      // 生成内容区块
      if (config.sections) {
        config.sections.forEach(section => {
          const sectionElement = document.createElement('div');
          sectionElement.className = 'content-section';

          let sectionHTML = `<h2><i class="fas fa-layer-group" style="margin-right: 20px; color: var(--color-accent); text-shadow: 0 0 15px var(--color-accent);"></i>${section.title || '区块标题'}</h2>`;

          if (section.content) {
            section.content.forEach(item => {
              if (item.type === 'paragraph') {
                sectionHTML += `<p>${item.text || ''}</p>`;
              } else if (item.type === 'heading') {
                sectionHTML += `<h3>${item.text || ''}</h3>`;
              } else if (item.type === 'list') {
                const listType = item.listType === 'ordered' ? 'ol' : 'ul';
                sectionHTML += `<${listType}>`;
                if (item.items) {
                  item.items.forEach(listItem => {
                    if (typeof listItem === 'object' && listItem.text && listItem.link) {
                      sectionHTML += `<li><a href="${viewerUrl(listItem.link)}">${listItem.text}</a></li>`;
                    } else {
                      sectionHTML += `<li>${listItem || ''}</li>`;
                    }
                  });
                }
                sectionHTML += `</${listType}>`;
              } else if (item.type === 'card') {
                // 卡片网格
                if (!sectionElement.querySelector('.content-grid')) {
                  const grid = document.createElement('div');
                  grid.className = 'content-grid';
                  sectionElement.appendChild(grid);
                }
                const grid = sectionElement.querySelector('.content-grid');
                const card = document.createElement('div');
                card.className = 'content-card';
                card.innerHTML = `
                  <h3><i class="fas fa-file-alt" style="margin-right: 15px; color: var(--color-accent); text-shadow: 0 0 10px var(--color-accent);"></i>${item.title || '卡片标题'}</h3>
                  <p>${item.description || ''}</p>
                  ${item.link ? `<a href="${viewerUrl(item.link)}">查看详情 <i class="fas fa-arrow-right"></i></a>` : ''}
                `;
                grid.appendChild(card);
              } else if (item.type === 'link') {
                sectionHTML += `<p><a href="${viewerUrl(item.link)}" class="btn">${item.text || '链接'}</a></p>`;
              }
            });
          }

          sectionElement.innerHTML = sectionHTML;
          contentSections.appendChild(sectionElement);
        });
      } else {
        // 默认内容
        const defaultSection = document.createElement('div');
        defaultSection.className = 'content-section';
        defaultSection.innerHTML = `
          <h2>欢迎访问</h2>
          <p>这是一个基于YAML配置文件生成的静态网站。</p>
          <p>请在website.yaml文件中添加sections配置来生成自定义内容。</p>
        `;
        contentSections.appendChild(defaultSection);
      }

      // 更新页脚
      const footer = document.getElementById('footer');
      footer.innerHTML = `<p>${config.footer || '&copy; 2026 网站名称. All rights reserved.'}</p>`;
    }

    // 初始化网站
    async function initWebsite() {
      const config = await loadWebsiteConfig();
      if (config) {
        // 生成页面内容
        generatePageContent(config);
      } else {
        // 加载失败
        document.title = '加载失败 - 网站';
        document.getElementById('header').innerHTML = `
          <h1 style="color: var(--color-accent);"><i class="fas fa-exclamation-circle"></i> 加载失败</h1>
          <p>无法加载配置文件，请检查文件是否存在。</p>
        `;
        document.getElementById('contentSections').innerHTML = `
          <div class="content-section">
            <h2>错误信息</h2>
            <p>无法加载website.yaml配置文件。</p>
            <p>请确保配置文件存在且格式正确。</p>
          </div>
        `;
        document.getElementById('footer').innerHTML = '<p>&copy; 2026 网站名称. All rights reserved.</p>';
      }
    }

    // 页面加载完成后初始化
    window.addEventListener('DOMContentLoaded', initWebsite);
  </script>
</body>
</html>
